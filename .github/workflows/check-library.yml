name: check library
on:
  pull_request:
    paths: ['library/**', 'tools/check_library.py']
  push:
    branches: [main]
    paths: ['library/**', 'tools/check_library.py']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install pillow
      - run: python3 tools/check_library.py
